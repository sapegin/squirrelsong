# Squirrelsong Dark Theme for Warp
# https://sapegin.me/squirrelsong/

accent: '{{terminalWhite}}' # Accent color for UI elements
background: '{{terminalBackground}}'
details: darker # Whether the theme is lighter or darker
foreground: '{{terminalForeground}}'
terminal_colors:
  bright:
    black: '{{terminalBrightBlack}}'
    blue: '{{terminalBrightBlue}}'
    cyan: '{{terminalBrightCyan}}'
    green: '{{terminalBrightGreen}}'
    magenta: '{{terminalBrightMagenta}}'
    red: '{{terminalBrightRed}}'
    white: '{{terminalBrightWhite}}'
    yellow: '{{terminalBrightYellow}}'

  normal:
    black: '{{terminalBlack}}'
    blue: '{{terminalBlue}}'
    cyan: '{{terminalCyan}}'
    green: '{{terminalGreen}}'
    magenta: '{{terminalMagenta}}'
    red: '{{terminalRed}}'
    white: '{{terminalWhite}}'
    yellow: '{{terminalYellow}}'
